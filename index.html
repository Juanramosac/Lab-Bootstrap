<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Bootstrap</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <div class="mb-4">
            <button type="button" class="btn btn-primary">Primario</button>
            <button type="button" class="btn btn-success">Éxito</button>
            <button type="button" class="btn btn-danger">Peligro</button>
        </div>

        <div class="mb-4">
            <p class="text-start">Izquierda</p>
            <p class="text-center text-danger">Centro</p> 
            <p class="text-end">Derecha</p> 
        </div>

        <div class="card" style="width: 18rem;">
            <div class="card-header">
                Mi Perfil
            </div>
            <img src="futbol.jpg" class="card-img-top" alt="Imagen de futbol">
            
            <ul class="list-group list-group-flush">
                <li class="list-group-item">Nombre: Juan Felipe Ramos Acosta</li>
                <li class="list-group-item">Ciudad: Bogotá</li>
                <li class="list-group-item">Hobby: Jugar futbol</li>
            </ul>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
